name: Spacirkovnik
options:
  bundleIdPrefix: sk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  Spacirkovnik:
    type: application
    platform: iOS
    sources:
      - Spacirkovnik
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.spacirkovnik
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "" # vyplň svojím Apple Developer Team ID na Macu
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Aplikácia potrebuje tvoju polohu, aby ťa viedla po trase hry a spúšťala úlohy na správnych miestach."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
