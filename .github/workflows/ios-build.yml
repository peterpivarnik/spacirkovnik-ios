name: iOS build (bez signovania)

# Overuje, že sa appka skompiluje. Beží na macOS runneri od GitHubu —
# lokálne nič neinštaluješ. Žiadne podpisovanie ani distribúcia.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # umožní spustiť ručne z GitHub UI (záložka Actions)

jobs:
  build:
    name: Build (iOS Simulator, unsigned)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vyber najnovší nainštalovaný Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Používam $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version
          swift --version

      - name: Nainštaluj XcodeGen
        run: brew install xcodegen

      - name: Vygeneruj Xcode projekt
        run: xcodegen generate

      - name: Build (bez signovania)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Spacirkovnik.xcodeproj \
            -scheme Spacirkovnik \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Priprav simulátor (GPS na cieľ prvej hry)
        run: |
          set -e
          APP_PATH="build/Build/Products/Debug-iphonesimulator/Spacirkovnik.app"

          # Vyber ľubovoľný dostupný iPhone simulátor na runneri.
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name|test("iPhone"))] | last | .udid')
          echo "Použijem simulátor: $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

          xcrun simctl bootstatus "$DEVICE_ID" -b
          # Nainštaluj appku a vopred jej povoľ polohu, nech nevyskočí systémový dialóg.
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl privacy "$DEVICE_ID" grant location sk.spacirkovnik || true
          # Nastav polohu na cieľ prvej navigačnej obrazovky hry „Lesnícka palica".
          xcrun simctl location "$DEVICE_ID" set 48.108843,17.116646

      - name: Nahraj video a prejdi hrou (UI test)
        run: |
          set -o pipefail
          mkdir -p artifacts
          # Spusti nahrávanie videa na pozadí.
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 artifacts/walkthrough.mp4 &
          REC_PID=$!

          xcodebuild test \
            -project Spacirkovnik.xcodeproj \
            -scheme Spacirkovnik \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

          # Ukonči nahrávanie videa.
          kill -INT "$REC_PID" 2>/dev/null || true
          sleep 3

      - name: Vytiahni screenshoty z výsledkov testu
        if: always()
        run: |
          brew install chargepoint/xcparse/xcparse || true
          # Bundle s výsledkami ostáva v build/, do artefaktu ide len to, čo z neho vytiahneme —
          # celý .xcresult sú desiatky MB a zožral by kvótu úložiska Actions.
          xcparse screenshots build/TestResults.xcresult artifacts/screenshots || true
          du -sh artifacts/* || true

      - name: Ulož video a screenshoty ako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough
          path: artifacts/
          if-no-files-found: warn
          # Na kontrolu buildu stačí týždeň; staré artefakty sa tak upratujú samé.
          retention-days: 7
